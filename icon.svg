<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#4f46e5"/>
  <!-- cat body -->
  <ellipse cx="256" cy="310" rx="75" ry="85" fill="white"/>
  <!-- cat head -->
  <circle cx="256" cy="200" r="72" fill="white"/>
  <!-- ears -->
  <polygon points="196,148 178,110 220,140" fill="white"/>
  <polygon points="316,148 334,110 292,140" fill="white"/>
  <polygon points="200,146 185,118 216,142" fill="#f9a8d4"/>
  <polygon points="312,146 327,118 296,142" fill="#f9a8d4"/>
  <!-- eyes -->
  <ellipse cx="232" cy="196" rx="11" ry="13" fill="#1e1b4b"/>
  <ellipse cx="280" cy="196" rx="11" ry="13" fill="#1e1b4b"/>
  <circle cx="236" cy="192" r="4" fill="white"/>
  <circle cx="284" cy="192" r="4" fill="white"/>
  <!-- nose -->
  <ellipse cx="256" cy="218" rx="5" ry="4" fill="#f9a8d4"/>
  <!-- mouth -->
  <path d="M248,224 Q256,232 264,224" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <line x1="200" y1="215" x2="245" y2="220" stroke="#ccc" stroke-width="2"/>
  <line x1="200" y1="225" x2="245" y2="225" stroke="#ccc" stroke-width="2"/>
  <line x1="267" y1="220" x2="312" y2="215" stroke="#ccc" stroke-width="2"/>
  <line x1="267" y1="225" x2="312" y2="225" stroke="#ccc" stroke-width="2"/>
  <!-- legs -->
  <ellipse cx="214" cy="375" rx="28" ry="35" fill="white"/>
  <ellipse cx="298" cy="375" rx="28" ry="35" fill="white"/>
  <!-- arms -->
  <ellipse cx="175" cy="305" rx="22" ry="32" fill="white" transform="rotate(-20,175,305)"/>
  <ellipse cx="337" cy="305" rx="22" ry="32" fill="white" transform="rotate(20,337,305)"/>
  <!-- book -->
  <rect x="206" y="295" width="100" height="70" rx="4" fill="#fbbf24"/>
  <rect x="206" y="295" width="50" height="70" rx="2" fill="#f59e0b"/>
  <line x1="256" y1="295" x2="256" y2="365" stroke="#92400e" stroke-width="2"/>
</svg>
